---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: pi-harness
  namespace: kagent
spec:
  byo: {}
  workload:
    # Example only: the maintainer's test image. Build and push your own and replace this digest (see the README).
    image: hguerrero0/pi-agent@sha256:f76ca835c1304c5a34c48381684e7c72e0f2adb00e9c536e53ffff9e17aee848
    command: ["/usr/local/bin/pi-a2a-adapter"]   # the adapter binary baked into the image
  env:
    - name: OPENROUTER_API_KEY
      value: kagent-credential-injected   # inert placeholder; the gateway injects the real key
    - name: PI_OFFLINE
      value: "1"   # skip Pi's startup calls to pi.dev, which the default-deny egress blocks
    - name: PI_PROVIDER
      value: openrouter
    - name: PI_MODEL
      value: nvidia/nemotron-3-ultra-550b-a55b:free
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: pi-template
  namespace: kagent
spec:
  description: Pi coding agent, running on Agent Substrate.
  modelConfig:
    name: openrouter-model-config
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: pi
  namespace: kagent
spec:
  template:
    ref:
      name: pi-template
  harnessRef:
    name: pi-harness
