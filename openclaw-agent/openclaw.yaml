apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: openclaw-harness
  namespace: kagent
spec:
  byo: {}
  workload:
    # Example only: the maintainer's test image. Build and push your own and replace this digest (see the README).
    image: hguerrero0/openclaw-agent@sha256:070faa615d630c284b65bc3caf1de7b1f640c0426da4ba9c27d2c8bcb680775d
    command: ["/usr/local/bin/openclaw-a2a-adapter"]       # the adapter binary baked into the image
  env:
    - name: OPENCLAW_EXEC_MODE
      value: full   # run exec without asking; the actor and the egress policy are the boundary. Use "ask" to approve each command.
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: openclaw-template
  namespace: kagent
spec:
  description: OpenClaw, running on Agent Substrate.
  systemPrompt: |
    You are OpenClaw running as a kagent agent. Keep answers short.
  modelConfig:
    name: anthropic-model-config
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: openclaw
  namespace: kagent
spec:
  template:
    ref:
      name: openclaw-template
  harnessRef:
    name: openclaw-harness
