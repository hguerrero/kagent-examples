# Two public hostnames. kagent.* goes to oauth2-proxy, which signs the user in
# and forwards to the UI's nginx. dex.* goes to the identity provider, because
# the browser has to reach it to sign in. Nothing routes to the UI Service or
# the controller directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  parentRefs:
    - name: kagent
      namespace: gateway-system
      sectionName: https
  hostnames:
    - kagent.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kagent-oauth2-proxy
          port: 4180
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: idp
spec:
  parentRefs:
    - name: kagent
      namespace: gateway-system
      sectionName: https
  hostnames:
    - dex.kagent.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dex
          port: 5556
