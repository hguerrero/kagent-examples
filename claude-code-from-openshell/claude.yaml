apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude-harness
  namespace: kagent
spec:
  claude: {}
  env:
    - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
      value: "1"   # skip Claude Code's own telemetry calls, which default-deny egress blocks
  workload:
    image: ghcr.io/kagent-dev/kagent/claude-harness@sha256:1bce31de2ffe651c23f1fc64d57d6625d937ad4e8e46836f4f2208128f2c2bb0
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: claude-template
  namespace: kagent
spec:
  description: Claude Code, running on Agent Substrate.
  modelConfig:
    name: anthropic-model-config
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: claude
  namespace: kagent
spec:
  templateRef:
    name: claude-template
  harnessRef:
    name: claude-harness
