apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude-harness
  namespace: kagent
spec:
  claude: {}
  env:
    - name: CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
      value: "1"   # skip Claude Code's own telemetry calls, which default-deny egress blocks
  workload:
    image: ghcr.io/kagent-dev/kagent/claude-harness@sha256:c61047f0a9000f207c597beae15207622a08f2c79323d51e1d36d39f812c9a5d
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: claude-template
  namespace: kagent
spec:
  description: Claude Code, running on Agent Substrate.
  modelConfig:
    name: anthropic-model-config
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: claude
  namespace: kagent
spec:
  template:
    ref:
      name: claude-template
  harnessRef:
    name: claude-harness
